[package]
name = "spui"
version = "4.0.0"
edition = "2021"
description = "SpaceOS-9 SPUI desktop environment"
license = "LicenseRef-Proprietary"

[dependencies]
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code", "shm", "render", "shape", "randr"] }
ttf-parser = "0.25"
ab_glyph_rasterizer = "0.1"
resvg = { version = "0.45", default-features = false }
png = "0.17"
zune-jpeg = "0.4"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
